services:
  db:
    image: pgvector/pgvector:pg15
    container_name: faceapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-faceapp}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - faceapp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-faceapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: faceapp-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"

volumes:
  faceapp-pgdata:
